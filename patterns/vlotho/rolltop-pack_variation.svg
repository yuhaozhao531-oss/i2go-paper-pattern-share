<svg xmlns="http://www.w3.org/2000/svg" width="720" height="348" viewBox="0 0 720 348"><title>Backpack with roll-top: change body width</title><desc>The same piece at the same scale. Original cut contour on the left, recalculated contour on the right.</desc><rect width="720" height="348" rx="16" fill="#f0f5ef"/><g fill="#24382b" font-family="Arial,sans-serif" font-size="18"><text x="30" y="34">Body width: 270 mm</text><text x="380" y="34">Body width: 297 mm</text><text x="30" y="61" font-size="14">Original cut contour</text><text x="380" y="61" font-size="14">After modification</text><svg x="20" y="72" width="330" height="218" viewBox="-8 -8 313 506" preserveAspectRatio="xMidYMid meet"><path d="M0,0L270,0L270,490L0,490Z" fill="#286b3d" fill-opacity=".08" stroke="#286b3d" stroke-width="2" vector-effect="non-scaling-stroke"/></svg><svg x="370" y="72" width="330" height="218" viewBox="-8 -8 313 506" preserveAspectRatio="xMidYMid meet"><path d="M0,0L297,0L297,490L0,490Z" fill="#a14d1c" fill-opacity=".08" stroke="#a14d1c" stroke-width="2" vector-effect="non-scaling-stroke"/></svg><text x="30" y="326" font-size="14">Cut edge: 270 × 490 mm</text><text x="380" y="326" font-size="14">Cut edge: 297 × 490 mm</text></g></svg>